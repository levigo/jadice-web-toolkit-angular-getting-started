server:
  address: 0.0.0.0
  port: 8080

management:
  server:
    address: 0.0.0.0
    port: 8000
    addApplicationContextHeader: false
  endpoints:
    web:
      exposure:
        include: health, metrics, info

  endpoint:
    health:
      show-details: ALWAYS

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

annotation:
  save:
    base-url: http://localhost:3000
    connect-timeout: 30
    request-timeout: 30
    authentication:
      username: user1
      password: test

# Restore render controls (rotation, gradation curve) when a document is loaded.
# The JSON is fetched server-side and attached to the document before it is read
# (see RenderControlsHttpSchemeDocumentDataProvider). Authentication for this URL is
# taken from webtoolkit.ddp.http.authentication below.
render-controls:
  load:
    enabled: true
    uri: http://localhost:3000/test93.rendercontrols.json

webtoolkit:
  clientConfiguration:
    maxUploadFileSize: 50000000
    internalCustomProperties:
      displayOpenFileAtStartup: "false"

  fileUploadEnabled: true
  uriProviderHttpEnabled: false
  annotationProfiles: /jwt-annotation-profile.xml, /jwt-demo-profile.xml
  defaultAnnotationProfile: JWT-Demo-Profile

  ddp:
    http:
      authentication:
        - host: localhost
          user: user1
          password: test

logging:
  level:
    root: WARN
  pattern:
    console: "%d %-5level [%thread] [clientId:%X{jwt.clientId}] [docId:%X{jwt.docIdentifier}]  %logger: %msg%n"
    file: "%d %-5level [%thread] [clientId:%X{clientId}] [docId:%X{jwt.docIdentifier}] %logger: %msg%n"
