server:
  address: 0.0.0.0
  port: 8080

management:
  server:
    address: 0.0.0.0
    port: 8000
    addApplicationContextHeader: false
  endpoints:
    web:
      exposure:
        include: health, metrics, info

  endpoint:
    health:
      show-details: ALWAYS

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

webtoolkit:
  annotation:
    save:
      http:
        enabled: true
        base-url: http://localhost:3000
        url-template: "{baseUrl}/{streamId}"
        filename-template: "{streamId}"
        connect-timeout: 30
        request-timeout: 30
        authentication:
          - host: localhost
            user: user1
            password: test

  clientConfiguration:
    maxUploadFileSize: 50000000
    internalCustomProperties:
      displayOpenFileAtStartup: "false"

  fileUploadEnabled: true
  uriProviderHttpEnabled: true
  annotationProfiles: /jwt-annotation-profile.xml, /jwt-demo-profile.xml
  defaultAnnotationProfile: JWT-Demo-Profile

  ddp:
    http:
      authentication:
        - host: localhost
          user: user1
          password: test

logging:
  level:
    root: WARN
  pattern:
    console: "%d %-5level [%thread] [clientId:%X{jwt.clientId}] [docId:%X{jwt.docIdentifier}]  %logger: %msg%n"
    file: "%d %-5level [%thread] [clientId:%X{clientId}] [docId:%X{jwt.docIdentifier}] %logger: %msg%n"
